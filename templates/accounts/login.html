
{% extends "base.html" %}

{% block content %}
<div style="max-width:420px; margin:60px auto; padding:30px; background:#1c1c1c; color:white; border-radius:12px;">

    <h2 style="text-align:center;">Welcome Back</h2>
    <p style="text-align:center;">Log in to your ModDrive account</p>

    {% if error_message %}
        <p style="color:#ff6666;">{{ error_message }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required
               style="width:100%; padding:12px; margin:10px 0 20px; box-sizing:border-box;">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               style="width:100%; padding:12px; margin:10px 0 20px; box-sizing:border-box;">

        <button type="submit"
                style="width:100%; padding:12px; background:#ff6600; color:white; border:none; border-radius:6px; cursor:pointer;">
            Login
        </button>
    </form>

    <p style="text-align:center; margin-top:20px;">
        Don't have an account?
        <a href="{% url 'accounts:register' %}" style="color:#ff6600;">Register</a>
    </p>

</div>
{% endblock %}
